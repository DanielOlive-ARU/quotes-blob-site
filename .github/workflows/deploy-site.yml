name: Deploy site to Azure Blob Static Website

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Upload site to $web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject API base URL into app-config.js
        env:
          API_HOSTNAME: ${{ vars.AZURE_FUNCTIONAPP_HOSTNAME }}
        run: |
          if [ -z "$API_HOSTNAME" ]; then
            echo "AZURE_FUNCTIONAPP_HOSTNAME repository Variable is not set" >&2
            exit 1
          fi
          sed -i "s#__API_BASE_URL__#https://$API_HOSTNAME#g" site/app-config.js
          if grep -q "__API_BASE_URL__" site/app-config.js; then
            echo "API_BASE_URL placeholder was not substituted" >&2
            exit 1
          fi

      - name: Upload to $web
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az storage blob upload-batch \
              --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
              --sas-token "${{ secrets.AZURE_STORAGE_SAS_TOKEN }}" \
              --destination '$web' \
              --source site \
              --overwrite true
