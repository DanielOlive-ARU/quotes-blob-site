name: E2E tests (post-deploy)

on:
  workflow_run:
    workflows:
      - "Deploy site to Azure Blob Static Website"
      - "Deploy API to Azure Functions"
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright against deployed site
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        env:
          SITE_URL: ${{ vars.AZURE_STORAGE_STATIC_WEB_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "AZURE_STORAGE_STATIC_WEB_URL repository Variable is not set" >&2
            exit 1
          fi
          npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore
